---
- name: Preparar Docker en toda la flota
  hosts: servidores
  tasks:
    - name: Instalar Docker y el SDK de Python
      ansible.builtin.apt:
        name:
          - docker.io
          - python3-docker
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Arrancar dockerd
      ansible.builtin.shell: |
        nohup dockerd > /var/log/dockerd.log 2>&1 &
        for i in $(seq 1 30); do
          docker info >/dev/null 2>&1 && exit 0
          sleep 1
        done
        cat /var/log/dockerd.log
        exit 1
      args:
        creates: /var/run/docker.pid


- name: Desplegar la base de datos
  hosts: db
  tasks:
    - name: Arrancar PostgreSQL
      community.docker.docker_container:
        name: tareas-db
        image: postgres:16
        state: started
        restart_policy: always
        network_mode: host
        volumes:
          - tareas-db-data:/var/lib/postgresql/data
        env:
          POSTGRES_DB: "{{ db_name }}"
          POSTGRES_USER: "{{ db_user }}"
          POSTGRES_PASSWORD: "{{ db_pass }}"
        healthcheck:
          test:
            - CMD-SHELL
            - "pg_isready -U {{ db_user }} -d {{ db_name }}"
          interval: 5s
          timeout: 5s
          retries: 10
      no_log: true

    - name: Esperar a que PostgreSQL acepte conexiones
      ansible.builtin.wait_for:
        host: 127.0.0.1
        port: 5432
        timeout: 120


- name: Desplegar la API de tareas
  hosts: app
  vars:
    version_app: "1.0.0"
    imagen: "ghcr.io/barlowe90/pc-simulacion-codigo:{{ version_app }}"
    host_bd: "{{ groups['db'][0] }}"

  tasks:
    - name: Iniciar sesión en GHCR
      community.docker.docker_login:
        registry_url: ghcr.io
        username: "{{ ghcr_user }}"
        password: "{{ ghcr_token }}"
      no_log: true

    - name: Descargar la imagen de la aplicación
      community.docker.docker_image:
        name: "{{ imagen }}"
        source: pull

    - name: Arrancar el contenedor de la API
      community.docker.docker_container:
        name: tareas-api
        image: "{{ imagen }}"
        state: started
        recreate: false
        restart_policy: always
        network_mode: host
        env:
          SPRING_DATASOURCE_URL: "jdbc:postgresql://{{ host_bd }}:5432/{{ db_name }}"
          SPRING_DATASOURCE_USERNAME: "{{ db_user }}"
          SPRING_DATASOURCE_PASSWORD: "{{ db_pass }}"
      no_log: true

    - name: Esperar a que la API esté sana
      ansible.builtin.uri:
        url: http://localhost:8080/actuator/health
        status_code: 200
        return_content: true
      register: salud
      retries: 20
      delay: 5
      until:
        - salud.status == 200
        - salud.json.status | default('') == 'UP'
